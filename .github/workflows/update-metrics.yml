name: Update profile

# Google Scholar and GitHub numbers of the profile (scripts/profile.json) and
# the images of README.md drawn from them (assets/), four times a day.

on:
  schedule:
    - cron: '17 0,6,12,18 * * *'   # minute 17: off the busy top of the hour
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # bibtexparser 2 removed the module that scholarly imports
        run: pip install "scholarly==1.7.11" "bibtexparser==1.4.4" "fonttools==4.51.0"

      - name: Google Scholar metrics
        run: python scripts/update_metrics.py
        timeout-minutes: 5

      - name: GitHub numbers and images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python scripts/github_cards.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets scripts/profile.json
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Update profile metrics"
          git pull --rebase --quiet
          git push

      # GitHub turns a scheduled workflow off after 60 days without activity
      # in the repository (this one stopped on 6 November 2026). The commits
      # above count as activity; for a long time without a change, enabling
      # the workflow again at every run keeps it on (the method of the
      # keepalive-workflow action).
      - name: Keep the schedule on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-metrics.yml/enable"
